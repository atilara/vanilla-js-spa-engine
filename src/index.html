<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS SPA</title>
</head>

<body>

    <nav>
        <a href="./index.html">Home</a> |
        <a href="./routes/about.html">About</a> |
        <a href="./routes/no-spa-nav.html" data-no-spa="true">No SPA navigation</a> |
        <a href="https://google.com">External link</a>
    </nav>

    <div class="cached-widget"
        style="padding: 1rem; margin: 1rem 0; border: 2px dashed #007bff; border-radius: 8px; background: #f8f9fa;">
        <h3 style="margin-top:0;">Global Search & Filter</h3>
        <p>This widget preserves its state across page navigations!</p>

        <label>
            <input type="checkbox" class="demo-toggle" data-cache-id="demo-toggle" />
            Enable Advanced Mode
        </label>
        <br><br>

        <input type="text" placeholder="Type a search query..." data-cache-id="demo-search"
            style="width: 100%; padding: 8px; box-sizing: border-box;" />

        <div data-cache-id="demo-clicks-wrapper" style="margin-top: 1rem;">
            Clicks: <strong class="demo-clicks">0</strong>
            <button class="demo-btn" style="margin-left: 10px; padding: 4px 12px; cursor: pointer;">Click Me</button>
        </div>
    </div>
    <script type="module" src="./app.js" data-spa-core></script>
</body>

</html>
